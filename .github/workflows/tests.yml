name: Tests

# Runs the addon's test suite on Lua 5.1 - WoW's dialect, which a newer
# local Lua does not exactly match (tests/wow_mock.lua notes the gaps) - and
# luacheck. On every push and pull request, and as the gate the release
# workflow calls before it packages anything.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-check

      - name: Test suite (Lua 5.1)
        run: lua5.1 tests/run.lua

      - name: Lint
        # luacheck exits 1 for warnings and 2+ for errors. The warning
        # backlog is mostly line length in generated data, so only errors
        # fail the build.
        run: |
          set +e
          luacheck SpecSage -q
          status=$?
          if [ "$status" -ge 2 ]; then exit "$status"; fi
